</style></head><body><main class="deck" aria-label="受託開発の進め方 スライド"><section class="slide hero"><svg class="hero-art" viewBox="0 0 400 440" aria-hidden="true"><g fill="#edf3f7"><rect x="40" y="35" width="330" height="85" rx="16"/><rect x="140" y="150" width="230" height="85" rx="16"/><rect x="80" y="265" width="290" height="85" rx="16"/></g><path d="M0 390H370" stroke="#376b94" stroke-width="5"/><circle cx="370" cy="390" r="9" fill="#376b94"/></svg><h1>受託開発の進め方<br><span class="dash">—</span> AI時代の実際</h1></section><section class="slide"><h2>全体は約6ヶ月。</h2><svg class="graphic" viewBox="0 0 1100 390" role="img" aria-label="約6ヶ月のガント。1〜2月目に要件定義、3〜6月目に実装と試用フィードバック、その後に納品または延長。"><path d="M260 60V325" stroke="#d9e2e9"/><path d="M387 60V325" stroke="#d9e2e9"/><path d="M514 60V325" stroke="#d9e2e9"/><path d="M641 60V325" stroke="#d9e2e9"/><path d="M768 60V325" stroke="#d9e2e9"/><path d="M895 60V325" stroke="#d9e2e9"/><path d="M1022 60V325" stroke="#d9e2e9"/><text x="323" y="35" text-anchor="middle" class="label">1月目</text><text x="450" y="35" text-anchor="middle" class="label">2月目</text><text x="577" y="35" text-anchor="middle" class="label">3月目</text><text x="704" y="35" text-anchor="middle" class="label">4月目</text><text x="831" y="35" text-anchor="middle" class="label">5月目</text><text x="958" y="35" text-anchor="middle" class="label">6月目</text><text x="0" y="145" class="label">要件定義</text><rect x="260" y="110" width="254" height="55" rx="12" fill="#edf3f7"/><text x="387" y="146" text-anchor="middle" class="label accent">約2ヶ月</text><text x="0" y="265" class="label">実装＋試用FB</text><rect x="514" y="230" width="508" height="55" rx="12" fill="#376b94"/><text x="768" y="266" text-anchor="middle" class="label" style="fill:white">約4ヶ月</text><path d="M1022 258H1034" stroke="#376b94" stroke-width="3"/><text x="1067" y="252" text-anchor="middle" class="label">納品 or<tspan x="1067" dy="30">延長</tspan></text></svg></section><section class="slide "><h2>AIで実装は短く。考える工程は重く。</h2><svg class="graphic" viewBox="0 0 1100 390" role="img" aria-label="要件と実装の比率。従来は要件1対実装4、AI導入後は要件1対実装2。同じ尺度で比較。"><defs><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#376b94"/></marker></defs><text x="0" y="132" class="label">従来</text><rect x="185" y="95" width="170" height="72" rx="6" fill="#376b94"/><text x="270" y="139" text-anchor="middle" class="label" style="fill:white">要件 1</text><rect x="355" y="95" width="680" height="72" rx="6" fill="#a6bed0"/><text x="695" y="139" text-anchor="middle" class="label" style="fill:#242e37">実装 4</text><text x="0" y="272" class="label">AI導入後</text><rect x="185" y="235" width="170" height="72" rx="6" fill="#376b94"/><text x="270" y="279" text-anchor="middle" class="label" style="fill:white">要件 1</text><rect x="355" y="235" width="340" height="72" rx="6" fill="#a6bed0"/><text x="525" y="279" text-anchor="middle" class="label" style="fill:#242e37">実装 2</text><text x="760" y="277" class="big accent">要件が主戦場へ</text></svg></section><section class="slide implementation"><h2>賢いモデルに、<br>終わるまで一気に実装させる。</h2><svg class="graphic" viewBox="0 0 1100 390" role="img" aria-label="要件・デザインをgoalでAstraに渡して実装。3〜4日、ずっと動かし続けることも。"><text x="550" y="115" text-anchor="middle" class="accent" style="font-size:45px;font-weight:750">3〜4日、ずっと動かし続けることも。</text><rect x="20" y="220" width="280" height="95" rx="12" fill="#edf3f7"/><text x="160" y="278" text-anchor="middle" class="label">要件・デザイン</text><path d="M320 267H385L370 257M385 267L370 277" fill="none" stroke="#376b94" stroke-width="3"/><rect x="410" y="220" width="300" height="95" rx="12" fill="#376b94"/><text x="560" y="278" text-anchor="middle" class="label" style="fill:white">/goal → Astra</text><path d="M730 267H795L780 257M795 267L780 277" fill="none" stroke="#376b94" stroke-width="3"/><rect x="820" y="220" width="260" height="95" rx="12" fill="#edf3f7"/><text x="950" y="278" text-anchor="middle" class="label">実装</text></svg></section><section class="slide "><h2>昼に見つけて、夜に直す。</h2><svg class="graphic" viewBox="0 0 1100 390" role="img" aria-label="昼にAIと人が動作確認、タスク起票、夜にAIがgoalで全て修正、翌朝再確認の循環"><defs><marker id="arr6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#376b94"/></marker></defs><rect x="0" y="0" width="535" height="375" rx="20" fill="#edf3f7"/><rect x="565" y="0" width="535" height="375" rx="20" fill="#376b94"/><text x="30" y="44" class="label accent">昼 / 人</text><text x="595" y="44" class="label" style="fill:white">夜 / AI</text><rect x="65" y="85" width="385" height="85" rx="12" fill="#edf3f7"/><text x="257.5" y="124.5" text-anchor="middle" class="label" style="">動作確認</text><rect x="65" y="245" width="385" height="85" rx="12" fill="#edf3f7"/><text x="257.5" y="295.5" text-anchor="middle" class="label" style="">おかしい所をタスク起票</text><rect x="630" y="160" width="405" height="100" rx="12" fill="#edf3f7"/><text x="832.5" y="207.0" text-anchor="middle" class="label" style="">/goal で全タスク修正</text><path d="M255 180V231" fill="none" stroke="#376b94" stroke-width="3" marker-end="url(#arr6)"/><defs><marker id="nightArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#a6bed0"/></marker></defs><path d="M465 286H550V210H615" fill="none" stroke="#a6bed0" stroke-width="3" marker-end="url(#nightArrow)"/><path d="M835 145V105H470" fill="none" stroke="#a6bed0" stroke-width="3" marker-end="url(#arr6)"/></svg></section><section class="slide "><h2>繰り返すほど、バグが減る。</h2><svg class="graphic" viewBox="0 0 1100 390" role="img" aria-label="反復1〜6回目にかけバグ件数が減る棒グラフ"><defs><marker id="arr7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#376b94"/></marker></defs><path d="M120 25V315H1060" fill="none" stroke="#aab6bf" stroke-width="2"/><text x="5" y="40" class="label">バグ件数</text><rect x="180" y="70" width="85" height="245" rx="5" fill="#376b94" opacity="1.0"/><text x="222" y="352" text-anchor="middle" class="label">1回目</text><rect x="325" y="129" width="85" height="186" rx="5" fill="#376b94" opacity="0.9"/><text x="367" y="352" text-anchor="middle" class="label">2回目</text><rect x="470" y="185" width="85" height="130" rx="5" fill="#376b94" opacity="0.8"/><text x="512" y="352" text-anchor="middle" class="label">3回目</text><rect x="615" y="230" width="85" height="85" rx="5" fill="#376b94" opacity="0.7"/><text x="657" y="352" text-anchor="middle" class="label">4回目</text><rect x="760" y="268" width="85" height="47" rx="5" fill="#376b94" opacity="0.6"/><text x="802" y="352" text-anchor="middle" class="label">5回目</text><rect x="905" y="290" width="85" height="25" rx="5" fill="#376b94" opacity="0.5"/><text x="947" y="352" text-anchor="middle" class="label">6回目</text><text x="1060" y="385" text-anchor="end" class="label">反復回数 →</text></svg></section><section class="slide"><h2>AI時代の受託開発は、こう進める。</h2><div class="summary"><p>要件は詳細に固める。</p><p>実装はAIに任せる。</p><p class="human-role">人間の役割は、要件を理解することと、<br>要件どおりになっているか確認すること。<span>（最近はPRすら見ていない）</span></p></div></section><button class="nav" aria-label="次のスライドへ（矢印キーで前後、Home / End、Fで全画面）"></button><div class="footer"><span class="counter" aria-live="polite"></span></div><div class="progress" aria-hidden="true"></div></main><script>
(()=>{'use strict';const slides=[...document.querySelectorAll('.slide')],counter=document.querySelector('.counter'),progress=document.querySelector('.progress');let current=0;function show(index){current=Math.max(0,Math.min(slides.length-1,index));slides.forEach((slide,i)=>{slide.classList.toggle('active',i===current);slide.setAttribute('aria-hidden',String(i!==current))});counter.textContent=`${String(current+1).padStart(2,'0')} / ${slides.length}`;progress.style.width=`${(current+1)/slides.length*100}%`;if(location.hash!==`#${current+1}`)history.replaceState(null,'',`#${current+1}`)}function readHash(){const match=location.hash.match(/^#(\d+)$/);show(match?Number(match[1])-1:0)}document.querySelector('.nav').addEventListener('click',()=>show(current+1));document.addEventListener('keydown',e=>{if(e.altKey||e.ctrlKey||e.metaKey)return;switch(e.key){case'ArrowRight':case'ArrowDown':case'PageDown':case' ':e.preventDefault();show(current+(e.shiftKey&&e.key===' '?-1:1));break;case'ArrowLeft':case'ArrowUp':case'PageUp':e.preventDefault();show(current-1);break;case'Home':e.preventDefault();show(0);break;case'End':e.preventDefault();show(slides.length-1);break;case'f':case'F':e.preventDefault();if(document.fullscreenElement){document.exitFullscreen?.().catch(()=>{})}else{document.documentElement.requestFullscreen?.().catch(()=>{})}break;}});window.addEventListener('hashchange',readHash);readHash()})();
</script></body></html>
